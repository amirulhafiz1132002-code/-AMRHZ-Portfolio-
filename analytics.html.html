<!doctype html> 
<html lang="en"><head><script src="/_sdk/telemetry_sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Connect - Growth Analytics</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
        body { font-family: 'DM Sans', sans-serif; }
        .bar { transition: height 0.3s ease; cursor: pointer; }
        .bar:hover { opacity: 0.8; }
        .stat-input { background: #2a2a4a; border: 1px solid #f97316; border-radius: 8px; color: #fff; padding: 4px 8px; width: 80px; text-align: center; }
        .progress-bar { transition: width 0.4s ease; }
    </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 </head>
 <body data-template-id="__page-root" class="min-h-screen w-full" style="background: rgb(26, 26, 46);">
  <div class="max-w-3xl mx-auto px-4 py-6"><!-- Header -->
   <header class="flex items-center gap-4 mb-8"><img data-template-id="profile-avatar" class="canva-image w-16 h-16 rounded-full object-cover border-2 border-orange-500" loading="lazy" src="canva://MAHNSIdC2hk/1" alt="Profile avatar of Amir Hakim">
    <div>
     <h1 data-template-id="page-title" class="canva-text font-bold" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 30px;">Growth Analytics</h1>
     <p data-template-id="page-subtitle" class="canva-text text-sm" style="color: rgb(148, 163, 184); font-weight: 400; font-style: normal; font-size: 15px;">@Amrhz · Track your developer journey</p>
    </div>
   </header><!-- Stats Cards -->
   <section class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
    <div data-template-id="card-commits" class="canva-card p-4 rounded-xl text-center" style="background: rgb(42, 42, 74);"><i data-lucide="git-commit" class="mx-auto mb-2 text-orange-400" style="width:24px;height:24px"></i>
     <div id="stat-commits" class="text-2xl font-bold text-white">
      847
     </div>
     <p data-template-id="card-commits-label" class="canva-text text-xs mt-1" style="color: rgb(148, 163, 184); font-weight: 400; font-style: normal; font-size: 15px;">Total Commits</p><button onclick="editStat('commits')" class="text-orange-400 text-xs mt-2 hover:underline">Edit</button>
    </div>
    <div data-template-id="card-streak" class="canva-card p-4 rounded-xl text-center" style="background: rgb(42, 42, 74);"><i data-lucide="flame" class="mx-auto mb-2 text-red-400" style="width:24px;height:24px"></i>
     <div id="stat-streak" class="text-2xl font-bold text-white">
      23
     </div>
     <p data-template-id="card-streak-label" class="canva-text text-xs mt-1" style="color: rgb(148, 163, 184); font-weight: 400; font-style: normal; font-size: 15px;">Day Streak</p><button onclick="editStat('streak')" class="text-orange-400 text-xs mt-2 hover:underline">Edit</button>
    </div>
    <div data-template-id="card-projects" class="canva-card p-4 rounded-xl text-center" style="background: rgb(42, 42, 74);"><i data-lucide="folder" class="mx-auto mb-2 text-blue-400" style="width:24px;height:24px"></i>
     <div id="stat-projects" class="text-2xl font-bold text-white">
      12
     </div>
     <p data-template-id="card-projects-label" class="canva-text text-xs mt-1" style="color: rgb(148, 163, 184); font-weight: 400; font-style: normal; font-size: 15px;">Projects</p><button onclick="editStat('projects')" class="text-orange-400 text-xs mt-2 hover:underline">Edit</button>
    </div>
    <div data-template-id="card-followers" class="canva-card p-4 rounded-xl text-center" style="background: rgb(42, 42, 74);"><i data-lucide="users" class="mx-auto mb-2 text-green-400" style="width:24px;height:24px"></i>
     <div id="stat-followers" class="text-2xl font-bold text-white">
      1,208
     </div>
     <p data-template-id="card-followers-label" class="canva-text text-xs mt-1" style="color: rgb(148, 163, 184); font-weight: 400; font-style: normal; font-size: 15px;">Followers</p><button onclick="editStat('followers')" class="text-orange-400 text-xs mt-2 hover:underline">Edit</button>
    </div>
   </section><!-- Weekly Activity -->
   <section class="mb-8">
    <h2 data-template-id="weekly-title" class="canva-text font-bold mb-4" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 18px;">Weekly Activity</h2>
    <div data-template-id="chart-bg" class="canva-card rounded-xl p-4" style="background: rgb(42, 42, 74);">
     <div class="flex items-end justify-between gap-2" style="height:160px" id="chart">
     </div>
     <div class="flex justify-between mt-2 text-xs text-gray-400"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
     </div>
     <p class="text-gray-500 text-xs mt-2 text-center">Click a bar to edit</p>
    </div>
   </section><!-- Goals -->
   <section>
    <h2 data-template-id="goals-title" class="canva-text font-bold mb-4" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 18px;">Monthly Goals</h2>
    <div class="space-y-4" id="goals-container">
     <div data-template-id="goal-1-bg" class="canva-card rounded-xl p-4" style="background: rgb(42, 42, 74);">
      <div class="flex justify-between items-center mb-2"><span data-template-id="goal-1-label" class="canva-text text-sm" style="color: rgb(226, 232, 240); font-weight: 400; font-style: normal; font-size: 15px;">Commit 100 times</span> <button onclick="editGoal(0)" class="text-orange-400 text-xs hover:underline">Edit</button>
      </div>
      <div class="w-full h-3 bg-gray-700 rounded-full overflow-hidden">
       <div id="goal-0-bar" class="progress-bar h-full bg-orange-500 rounded-full" style="width:70%"></div>
      </div><span id="goal-0-val" class="text-xs text-gray-400 mt-1 inline-block">70%</span>
     </div>
     <div data-template-id="goal-2-bg" class="canva-card rounded-xl p-4" style="background: rgb(42, 42, 74);">
      <div class="flex justify-between items-center mb-2"><span data-template-id="goal-2-label" class="canva-text text-sm" style="color: rgb(226, 232, 240); font-weight: 400; font-style: normal; font-size: 15px;">Ship 3 new features</span> <button onclick="editGoal(1)" class="text-orange-400 text-xs hover:underline">Edit</button>
      </div>
      <div class="w-full h-3 bg-gray-700 rounded-full overflow-hidden">
       <div id="goal-1-bar" class="progress-bar h-full bg-blue-500 rounded-full" style="width:45%"></div>
      </div><span id="goal-1-val" class="text-xs text-gray-400 mt-1 inline-block">45%</span>
     </div>
     <div data-template-id="goal-3-bg" class="canva-card rounded-xl p-4" style="background: rgb(42, 42, 74);">
      <div class="flex justify-between items-center mb-2"><span data-template-id="goal-3-label" class="canva-text text-sm" style="color: rgb(226, 232, 240); font-weight: 400; font-style: normal; font-size: 15px;">Gain 200 followers</span> <button onclick="editGoal(2)" class="text-orange-400 text-xs hover:underline">Edit</button>
      </div>
      <div class="w-full h-3 bg-gray-700 rounded-full overflow-hidden">
       <div id="goal-2-bar" class="progress-bar h-full bg-green-500 rounded-full" style="width:90%"></div>
      </div><span id="goal-2-val" class="text-xs text-gray-400 mt-1 inline-block">90%</span>
     </div>
    </div>
   </section>
  </div>
  <script src="/_sdk/editing_sdk.js"></script>
  <script>
        lucide.createIcons();

        const stats = { commits: 847, streak: 23, projects: 12, followers: 1208 };
        const weekData = [5, 12, 8, 15, 10, 3, 7];
        const goals = [70, 45, 90];

        function renderChart() {
            const chart = document.getElementById('chart');
            const max = Math.max(...weekData, 1);
            chart.innerHTML = weekData.map((v, i) =>
                `<div class="bar flex-1 bg-orange-500 rounded-t" style="height:${(v/max)*100}%" title="${v} commits" onclick="editBar(${i})"></div>`
            ).join('');
        }

        function editStat(key) {
            const el = document.getElementById('stat-' + key);
            const current = stats[key];
            const input = document.createElement('input');
            input.type = 'number';
            input.value = current;
            input.className = 'stat-input';
            input.onblur = () => {
                const val = parseInt(input.value) || 0;
                stats[key] = val;
                el.textContent = val.toLocaleString();
            };
            input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
            el.textContent = '';
            el.appendChild(input);
            input.focus();
        }

        function editBar(idx) {
            const val = prompt_inline(weekData[idx], (newVal) => {
                weekData[idx] = newVal;
                renderChart();
            });
        }

        function prompt_inline(current, cb) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/50 flex items-center justify-center z-50';
            overlay.innerHTML = `<div class="bg-[#2a2a4a] p-6 rounded-xl text-center"><p class="text-white text-sm mb-3">Enter new value:</p><input type="number" value="${current}" class="stat-input text-lg w-24 mb-3"><br><button class="bg-orange-500 text-white px-4 py-1 rounded text-sm font-bold">Save</button></div>`;
            document.body.appendChild(overlay);
            const inp = overlay.querySelector('input');
            inp.focus();
            inp.select();
            const save = () => { cb(parseInt(inp.value)||0); overlay.remove(); };
            overlay.querySelector('button').onclick = save;
            inp.onkeydown = (e) => { if(e.key==='Enter') save(); };
            overlay.onclick = (e) => { if(e.target===overlay) overlay.remove(); };
        }

        function editGoal(idx) {
            prompt_inline(goals[idx], (val) => {
                goals[idx] = Math.min(100, Math.max(0, val));
                document.getElementById('goal-'+idx+'-bar').style.width = goals[idx]+'%';
                document.getElementById('goal-'+idx+'-val').textContent = goals[idx]+'%';
            });
        }

        renderChart();
    </script>
